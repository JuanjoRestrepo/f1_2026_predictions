name: Docker Build and Publish

# Publishing is intentionally tied to version tags only.
#
# Nothing consumes this image: the dashboard is built by Vercel from source, the
# pipeline runs on Databricks serverless compute, and no manifest references a
# container. Building on every push to master therefore published the same bytes
# twice per release -- once for the merge commit and again for the tag -- and cost
# ~7 minutes a run for no consumer. `workflow_dispatch` remains for on-demand
# publishes (useful for testing a Dockerfile change on a branch).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Placeholder to silence static analysis warnings in the IDE
  IMAGE_NAME_LC: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the artifact this job just produced, by digest.
      #
      # Building is not evidence that the image works: the previous Dockerfile left
      # /app owned by root, so `f1user` could not create its cache directories and
      # uvicorn died on startup with PermissionError. Nothing ran the image, so the
      # broken artifact was published on every merge unnoticed. This step makes the
      # published image mean something.
      - name: Smoke-test the image (${{ matrix.platform }})
        run: |
          image="${REGISTRY}/${IMAGE_NAME_LC}@${{ steps.build.outputs.digest }}"
          docker run -d --name smoke --platform ${{ matrix.platform }} -p 8000:8000 "${image}"

          status=""
          for _ in $(seq 1 60); do
            status=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8000/health || true)
            [ "${status}" = "200" ] && break
            sleep 2
          done

          echo "GET /health -> ${status}"
          cat /tmp/health.json 2>/dev/null || true
          docker logs smoke 2>&1 | tail -20 || true
          docker rm -f smoke >/dev/null 2>&1 || true

          if [ "${status}" != "200" ]; then
            echo "::error::The image built for ${{ matrix.platform }} does not serve /health."
            exit 1
          fi

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Manifests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Download all digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(echo "${{ steps.meta.outputs.tags }}" | xargs -I {} echo "--tag {}") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ steps.meta.outputs.version }}

  # ---------------------------------------------------------------------------
  # NOTE: the former `deploy-trigger` job was removed as part of consolidating
  # orchestration onto Databricks Lakeflow (see resources/jobs.yml). The
  # Trigger.dev task definitions, config and access token are no longer used.
  # ---------------------------------------------------------------------------
