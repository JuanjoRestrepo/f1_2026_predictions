name: Scheduled Race Sync & Briefing

# ---------------------------------------------------------------------------
# Orchestration ownership
# ---------------------------------------------------------------------------
# Race-weekend scheduling is owned by Databricks Lakeflow Jobs
# (resources/jobs.yml -> f1_2026_race_predictions_job, cron "0 0 6 ? * FRI-MON").
# This workflow is now a MANUAL, on-demand fallback only.
#
# It previously carried its own Friday/Monday/Wednesday cron, which duplicated
# the Databricks schedule and risked double notifications and racing git
# writes. Use the Actions UI "Run workflow" button to replay a run by hand.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      round:
        description: 'Force a specific round number'
        required: false
        type: string
      mode:
        description: 'Force mode (pre-race or post-race)'
        required: false
        default: 'post-race'
        type: choice
        options:
          - pre-race
          - post-race
      season:
        description: 'Season year (default: 2026)'
        required: false
        default: '2026'
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'

jobs:
  detect-and-run:
    name: Detect Race & Run Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Detect race (auto-mode)
        id: detect
        if: ${{ !inputs.round }}
        env:
          SEASON: ${{ inputs.season || '2026' }}
        run: |
          DOW=$(date +%u)
          if [ "$DOW" -eq 5 ]; then
            echo "Mode: Pre-Race (Friday Detection)"
            FUNC="detect_upcoming_race"
            echo "mode=pre-race" >> $GITHUB_OUTPUT
          else
            echo "Mode: Post-Race (Audit Detection)"
            FUNC="detect_last_race"
            echo "mode=post-race" >> $GITHUB_OUTPUT
          fi

          RESULT=$(uv run python -c "
          from f1_predictions.utils.race_detector import $FUNC
          result = $FUNC(int('$SEASON'))
          import json
          print(json.dumps(result) if result else '')
          ")
          
          if [ -z "$RESULT" ]; then
            echo "No relevant race detected. Exiting."
            echo "race_found=false" >> $GITHUB_OUTPUT
          else
            ROUND=$(echo $RESULT | uv run python -c "import sys, json; print(json.load(sys.stdin)['round'])")
            EVENT=$(echo $RESULT | uv run python -c "import sys, json; print(json.load(sys.stdin)['gp_name'])")
            echo "Race detected: $EVENT (Round $ROUND)"
            echo "race_found=true" >> $GITHUB_OUTPUT
            echo "round=$ROUND" >> $GITHUB_OUTPUT
            echo "event=$EVENT" >> $GITHUB_OUTPUT
          fi

      - name: Set round (manual override)
        id: set-round
        if: ${{ inputs.round }}
        run: |
          echo "race_found=true" >> $GITHUB_OUTPUT
          echo "round=${{ inputs.round }}" >> $GITHUB_OUTPUT

      - name: Resolve final round number
        id: resolve
        run: |
          AUTO_FOUND="${{ steps.detect.outputs.race_found }}"
          MANUAL_FOUND="${{ steps.set-round.outputs.race_found }}"
          if [ "$AUTO_FOUND" = "true" ]; then
            echo "race_found=true" >> $GITHUB_OUTPUT
            echo "round=${{ steps.detect.outputs.round }}" >> $GITHUB_OUTPUT
            echo "mode=${{ steps.detect.outputs.mode }}" >> $GITHUB_OUTPUT
            echo "event=${{ steps.detect.outputs.event }}" >> $GITHUB_OUTPUT
          elif [ "$MANUAL_FOUND" = "true" ]; then
            echo "race_found=true" >> $GITHUB_OUTPUT
            echo "round=${{ steps.set-round.outputs.round }}" >> $GITHUB_OUTPUT
            echo "mode=${{ inputs.mode || 'post-race' }}" >> $GITHUB_OUTPUT
            echo "event=Grand Prix" >> $GITHUB_OUTPUT
          else
            echo "race_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Check credentials for this run
        if: steps.resolve.outputs.race_found == 'true'
        # Warnings, never failures: the pipeline degrades honestly on its own,
        # but a green run that silently sends nothing is a trap. GitHub renders
        # ::warning:: annotations at the top of the run page, so the state of
        # the run is visible without reading the logs.
        env:
          F1_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          F1_GMAIL_USER: ${{ secrets.F1_GMAIL_USER }}
          F1_GMAIL_APP_PASSWORD: ${{ secrets.F1_GMAIL_APP_PASSWORD }}
          F1_RECIPIENT_EMAIL: ${{ secrets.F1_RECIPIENT_EMAIL }}
          F1_DISCORD_WEBHOOK_URL: ${{ secrets.F1_DISCORD_WEBHOOK_URL }}
        run: |
          missing=""
          for name in F1_GEMINI_API_KEY F1_GMAIL_USER F1_GMAIL_APP_PASSWORD \
                      F1_RECIPIENT_EMAIL F1_DISCORD_WEBHOOK_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Unset:${missing}"
          fi

          if [ -z "$F1_GEMINI_API_KEY" ]; then
            echo "::warning::F1_GEMINI_API_KEY is empty — race narratives fall back to non-AI copy."
          fi

          gmail_ready=false
          if [ -n "$F1_GMAIL_USER" ] && [ -n "$F1_GMAIL_APP_PASSWORD" ]; then
            gmail_ready=true
          fi
          discord_ready=false
          if [ -n "$F1_DISCORD_WEBHOOK_URL" ]; then
            discord_ready=true
          fi
          echo "Notification channels available: gmail=$gmail_ready discord=$discord_ready"
          if [ "$gmail_ready" = "false" ] && [ "$discord_ready" = "false" ]; then
            echo "::warning::No notification channel can be built — this run completes without sending anything."
          fi

      - name: Ingest completed race into Gold training set
        if: steps.resolve.outputs.race_found == 'true' && steps.resolve.outputs.mode == 'post-race'
        # Best-effort incremental learning step: pull the just-completed round's
        # laps (Bronze → Silver → Gold) so the model refit below trains on the
        # newest real result. Non-fatal — a FastF1 hiccup must never block
        # prediction, reporting or notification. ingest_season.py is idempotent
        # and skips rounds whose Parquets already exist.
        continue-on-error: true
        env:
          F1_TARGET_SEASON: ${{ inputs.season || '2026' }}
          F1_FASTF1_CACHE_DIR: /tmp/fastf1_cache
        run: |
          uv run python scripts/ingest_season.py \
            --year ${{ inputs.season || '2026' }} \
            --rounds ${{ steps.resolve.outputs.round }}

      - name: Run ML simulation
        if: steps.resolve.outputs.race_found == 'true'
        run: |
          uv run python scripts/simulate_race.py \
            --round ${{ steps.resolve.outputs.round }} \
            --event "${{ steps.resolve.outputs.event }}"

      - name: Run master pipeline
        if: steps.resolve.outputs.race_found == 'true'
        env:
          # The repository secret is GEMINI_API_KEY (no F1_ prefix). Referencing
          # a non-existent name here would set F1_GEMINI_API_KEY to the empty
          # string, which wins over the GEMINI_API_KEY alias in config.py and
          # silently disables AI narratives.
          F1_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          F1_GEMINI_MODEL: gemini-3.1-pro-preview
          F1_GEMINI_FALLBACK_MODEL: gemini-3.5-flash
          F1_TARGET_SEASON: ${{ inputs.season || '2026' }}
          F1_FASTF1_CACHE_DIR: /tmp/fastf1_cache
          F1_DATA_RAW_DIR: data/raw
          F1_DATA_PROCESSED_DIR: data/processed
          F1_DATA_OUTPUTS_DIR: data/outputs
          F1_DATA_EXTERNAL_DIR: data/external
          F1_MODELS_DIR: models/artifacts
          F1_REPORTS_DIR: reports
        run: |
          uv run python scripts/master_pipeline.py \
            --round ${{ steps.resolve.outputs.round }} \
            --auto

      - name: Compute post-race verdict
        if: steps.resolve.outputs.race_found == 'true' && steps.resolve.outputs.mode == 'post-race'
        # Non-fatal: if ground truth (FastF1) or predictions are unavailable,
        # the notification step degrades to an honest prediction preview.
        continue-on-error: true
        env:
          F1_TARGET_SEASON: ${{ inputs.season || '2026' }}
        run: |
          uv run python -c "
          import json
          from pathlib import Path
          from f1_predictions.evaluation.post_race_verdict import (
              load_predictions, load_actuals, compute_verdict
          )
          round_num = int('${{ steps.resolve.outputs.round }}')
          season = int('${{ inputs.season || 2026 }}')
          event_name = '${{ steps.resolve.outputs.event }}'
          safe_event = event_name.replace(' ', '_')
          predictions_path = Path('reports') / str(season) / safe_event / 'results' / 'predictions.csv'
          predictions = load_predictions(predictions_path)
          actuals = load_actuals(season, round_num)
          verdict = compute_verdict(predictions, actuals, round_num, 'Grand Prix')
          verdict_path = Path('data/outputs') / f'verdict_round_{round_num:02d}.json'
          verdict_path.write_text(json.dumps(verdict.to_dict(), indent=2))
          "

      - name: Send notification
        if: steps.resolve.outputs.race_found == 'true'
        env:
          F1_GMAIL_USER: ${{ secrets.F1_GMAIL_USER }}
          F1_GMAIL_APP_PASSWORD: ${{ secrets.F1_GMAIL_APP_PASSWORD }}
          F1_RECIPIENT_EMAIL: ${{ secrets.F1_RECIPIENT_EMAIL }}
          F1_DISCORD_WEBHOOK_URL: ${{ secrets.F1_DISCORD_WEBHOOK_URL }}
          F1_TARGET_SEASON: ${{ inputs.season || '2026' }}
        run: |
          uv run python -c "
          import json, os
          from pathlib import Path
          from f1_predictions.evaluation.post_race_verdict import RaceVerdict
          from f1_predictions.utils.email_builder import build_email_html, build_subject
          from f1_predictions.utils.notifications import (
              GmailSMTPChannel, DiscordWebhookChannel,
              NotificationDispatcher, RaceBriefingPayload
          )
          from f1_predictions.utils.config import get_settings

          settings = get_settings()
          round_num = int('${{ steps.resolve.outputs.round }}')
          mode = '${{ steps.resolve.outputs.mode }}'
          event_name = '${{ steps.resolve.outputs.event }}'
          
          safe_event = event_name.replace(' ', '_')
          results_dir = Path('reports') / str(settings.target_season) / safe_event / 'results'
          summaries_dir = Path('reports') / str(settings.target_season) / 'summaries'

          verdict_path = Path('data/outputs') / f'verdict_round_{round_num:02d}.json'
          if mode == 'post-race' and verdict_path.exists():
              verdict = RaceVerdict(**json.loads(verdict_path.read_text()))
              candidates = [
                  results_dir / f'report_round_{round_num}.md',
                  results_dir / f'report_round_{round_num:02d}.md',
                  summaries_dir / f'report_round_{round_num}.md',
              ]
              subj_prefix = ''
          else:
              # Pre-race, or a post-race run whose verdict could not be
              # computed: send an honest preview rather than fabricated
              # accuracy metrics.
              verdict = RaceVerdict(
                  round=round_num,
                  gp_name=event_name,
                  mae_lap_time_s=0,
                  mape_pct=0,
                  winner_correct=False,
                  podium_accuracy_pct=0,
                  top10_accuracy_pct=0,
                  status='preview',
              )
              candidates = [
                  results_dir / f'predicted_report_round_{round_num}.md',
                  results_dir / f'predicted_report_round_{round_num:02d}.md',
                  summaries_dir / f'predicted_report_round_{round_num}.md',
              ]
              subj_prefix = '🚀 PREDICTION PREVIEW: '

          ai_narrative = 'Simulation complete.'
          for cand in candidates:
              if cand.exists():
                  ai_narrative = cand.read_text()
                  break
          
          html = build_email_html(verdict, ai_narrative=ai_narrative)
          subject = subj_prefix + build_subject(verdict)

          channels = []
          if settings.gmail_user and settings.gmail_app_password:
              channels.append(
                  GmailSMTPChannel(
                      settings.gmail_user,
                      settings.gmail_app_password,
                      settings.recipient_email or settings.gmail_user,
                  )
              )
          if settings.discord_webhook_url:
              channels.append(DiscordWebhookChannel(settings.discord_webhook_url))
          
          if channels:
              dispatcher = NotificationDispatcher(channels)
              dispatcher.dispatch(RaceBriefingPayload(verdict=verdict, html_body=html, subject=subject))
          else:
              print("No notification channels configured (credentials absent). Skipping dispatch.")
          "
