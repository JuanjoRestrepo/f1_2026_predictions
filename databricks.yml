# =============================================================================
# Databricks Asset Bundle (DABs) — f1_2026_predictions
#
# This file is the root bundle configuration. Resource definitions are split
# into resources/*.yml and included here per the DABs best-practice guide.
#
# Deploy:
#   databricks bundle validate --target dev
#   databricks bundle deploy  --target dev
#   databricks bundle run     --target dev f1_2026_race_predictions_job
#
# Reference: .agents/skills/databricks/references/cicd-dabs.md
# =============================================================================

bundle:
  name: f1_2026_predictions

# Split resource definitions (pipelines, jobs) into resources/ subdirectory
include:
  - resources/*.yml

# ---------------------------------------------------------------------------
# Variables — overridden per target below
# ---------------------------------------------------------------------------
variables:
  catalog:
    description: Unity Catalog catalog name for this target environment.
    default: f1_2026_dev
  schema:
    description: Unity Catalog schema (layer) within the catalog.
    default: race_pace
  schedule_pause_status:
    description: PAUSED for non-prod targets; UNPAUSED for prod.
    default: PAUSED
  pipeline_development:
    description: Development mode for DLT pipeline (false in production).
    default: true

# ---------------------------------------------------------------------------
# Deployment Targets
# dev      → individual developer workspace (mode: development adds [dev <user>] prefix)
# staging  → shared integration environment (mirrors prod config, paused schedule)
# prod     → production; deployed under the current user; UNPAUSED schedule
# ---------------------------------------------------------------------------
targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: main
      schema: race_pace
      schedule_pause_status: PAUSED
      pipeline_development: true

  # The workspace metastore has no default storage root, so the CLI cannot
  # create standalone catalogs. Both environments therefore live as dedicated
  # schemas inside the existing `main` catalog. This still gives each target
  # isolated tables and a separate `raw_telemetry` Volume.
  staging:
    mode: development
    variables:
      catalog: main
      schema: f1_2026_staging
      schedule_pause_status: PAUSED
      pipeline_development: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/restrepojuanjo@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: f1_2026_prod
      schedule_pause_status: UNPAUSED
      pipeline_development: false

