# =============================================================================
# F1 2026 Circuit Configuration Registry
# Single source of truth for all circuit-specific parameters.
#
# Fields per circuit:
#   base_lap_time_s       : Nominal dry-weather pole-lap reference time (seconds).
#                           Used as a normalisation anchor for delta features.
#   total_laps            : Official race distance in laps.
#   overtake_difficulty   : 0.0 (trivial) → 1.0 (impossible). Encodes how much
#                           qualifying grid position determines finishing order.
#                           Derived from historical overtake frequency per circuit
#                           (source: F1 Metrics / RacingReference).
#   tyre_wear_type        : "thermal" | "mechanical". Governs which degradation
#                           slope prior the pipeline uses.
#   safety_car_probability: Historical VSC/SC deployment rate (0.0–1.0).
#   pit_loss_time_s       : Average time delta lost per pit stop (entry + stop + exit).
#   typical_strategy      : Dominant 1-stop compound sequence (ordered list).
#   alt_strategy          : Alternate 2-stop or soft-start strategy.
#   drs_zones             : Number of DRS activation zones.
#   circuit_type          : "street" | "permanent" | "hybrid"
# =============================================================================

