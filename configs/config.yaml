  # ── Round 6: Monaco ────────────────────────────────────────────────────────
  # Monaco is the single biggest outlier on the F1 calendar.
  # Key characteristics:
  #   - Lowest average speed (~161 km/h vs. ~230 km/h elsewhere)
  #   - Highest overtake_difficulty on the calendar — qualifying = destiny
  #   - Highest safety_car_probability (barriers everywhere, zero run-off)
  #   - Highest pit_loss_time_s (tight pit lane entry, mandatory speed limiter)
  #   - Mechanical tyre wear (slow corners, no sustained high-speed loading)
  #   - Single mandatory stop; undercuts almost never succeed
