# resources/volumes.yml
# Unity Catalog Volume definitions for the bundle.
# Referenced by databricks.yml via the `include: [resources/*.yml]` directive.
#
# raw_telemetry is the Bronze landing zone: the ingest job task
# (databricks_entrypoint.py --run-mode ingest) writes per-round FastF1 laps
# here as Parquet, and the DLT medallion pipeline tails it with Auto Loader.
# The Volume must exist before either the job or the pipeline runs, so it is
# declared as a managed bundle resource and created on deploy.

resources:
  volumes:
    raw_telemetry:
      name: raw_telemetry
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      volume_type: MANAGED
      comment: >
        Landing zone for raw FastF1 lap telemetry ingested by the
        f1_2026_race_predictions_job ingest_task. Layout:
        season=<year>/round=<NN>/race_laps.parquet

    # dashboard_bundle is the release staging area for the dashboard artifacts.
    # `--run-mode report` seeds it from the published bundle (or the repository
    # on first run), regenerates the completed round, and writes the season tree
    # here; `--run-mode export` publishes it. Keeping it in Unity Catalog means
    # the site's data no longer depends on a developer machine producing the
    # artifacts. Layout: season=<year>/<event dir>/results/...
    dashboard_bundle:
      name: dashboard_bundle
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      volume_type: MANAGED
      comment: >
        Release staging area for the dashboard report bundle written by the
        report task and published by the export task.

    # f1_data holds the pipeline's raw/processed/Gold Parquet tree, mirroring
    # the repository's data/ layout. `--run-mode backfill` builds it from
    # FastF1 and `--run-mode simulate` reads it, so the race simulation no
    # longer depends on a developer machine having run ingest_season.py.
    # Layout: raw|laps|season=<year>/round=<NN>/, processed/..., outputs/...
    f1_data:
      name: f1_data
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      volume_type: MANAGED
      comment: >
        Pipeline data tree (raw, processed, Gold) used by the cloud backfill and
        race simulation run-modes.
